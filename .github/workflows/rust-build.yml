name: rust-build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          # NOTE: aarch64-unknown-linux-musl cross compilation requires the
          # musl cross-toolchain which is not preinstalled on ubuntu-latest.
          # Re-enable when a proper cross setup is added (e.g. apt-get install
          # gcc-aarch64-linux-musl + CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER).
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build workspace
        # NOTE: --locked is intentionally NOT used until Cargo.lock is committed.
        # Until then CI writes/updates Cargo.lock on each run.
        run: cargo build --workspace --release --target ${{ matrix.target }} --verbose

      - name: Package binaries (unix, tar.gz keeps the exec bit)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../gostc-rs-${{ matrix.target }}.tar.gz \
            gostc-rs-admin gostc-rs-tunnel-server gostc-rs-tunnel-client gostc-rs-gateway

      - name: Package binaries (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/gostc-rs-*.exe `
            -DestinationPath gostc-rs-${{ matrix.target }}.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gostc-rs-${{ matrix.target }}
          path: gostc-rs-${{ matrix.target }}.*
          if-no-files-found: error

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    continue-on-error: true   # don't fail the run on clippy warnings yet
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
      - run: cargo clippy --workspace --all-targets -- -W warnings